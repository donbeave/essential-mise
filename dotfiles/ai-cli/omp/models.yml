providers:
  zai-glm-flash:
    baseUrl: https://api.z.ai/api/coding/paas/v4
    api: openai-completions
    models:
      - id: glm-5.3-flash
        name: GLM-5.3-Flash (Z.AI)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 131072
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: max
        compat:
          supportsReasoningEffort: true
          extraBody:
            thinking:
              type: enabled
              clear_thinking: false
      - id: glm-5.3
        name: GLM-5.3 (Z.AI)
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 131072
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: max
        compat:
          supportsReasoningEffort: true
          extraBody:
            thinking:
              type: enabled
              clear_thinking: false
  openrouter:
    modelOverrides:
      deepseek/deepseek-v4.1-flash:
        compat:
          openRouterRouting:
            order: [morph, decart]
      z-ai/glm-5.3-flash:
        compat:
          openRouterRouting:
            order: [inference-net, decart, parasail]
      xiaomi/mimo-v2.6-flash:
        compat:
          openRouterRouting:
            order: [makora, deepinfra]
