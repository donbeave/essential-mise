[bootstrap.packages]
"brew:ripgrep" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:ast-grep" = "latest"
"brew:semgrep" = "latest"
"brew:jq" = "latest"
"brew:yq" = "latest"
"brew:dasel" = "latest"
"brew:sd" = "latest"
"brew:git-delta" = "latest"
"brew:eza" = "latest"
"brew:zoxide" = "latest"
"brew:tree" = "latest"
"brew:tokei" = "latest"
"brew:hyperfine" = "latest"
"brew:shellcheck" = "latest"
"brew:shfmt" = "latest"
"brew:universal-ctags" = "latest"
"brew:rtk" = "latest"
"brew:agent-browser" = "latest"

[bootstrap.hooks.post-packages]
description = "Presence-only real Homebrew: FFF MCP; upgrades are separate"
run = [
  "if ! /opt/homebrew/bin/brew list --formula fff-mcp >/dev/null 2>&1; then /opt/homebrew/bin/brew install dmtrKovalenko/fff/fff-mcp; fi",
  "/opt/homebrew/bin/fff-mcp --healthcheck",
]
