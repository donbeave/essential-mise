schema = 2

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 2
plan_timeout_minutes = 15
crate_timeout_minutes = 15
pull_request_cache_policy = "read-only"
runner_label = "ubuntu-26.04"

[resources]
compiler_process_budget = 2
test_process_budget = 2

[test_sharding]
default_shards = 1

[test_sharding.by_manifest]

[stacks]
ignore = []

[stacks.rust]
compile_driver = "mbx"
compiled_state = "off"
test_runner = "cargo_nextest"
run_ignored = "default"

[[stacks.rust.configurations]]
name = "default"
features = ["default"]
all_features = true
target = "host"

[stacks.rust.release]
enabled = true
manifest_path = "apps/essential-mise-console/Cargo.toml"
packages = ["essential-mise-console"]
publishable_workspace = false
environment = "release"
release_pr = true
tag_name = "v{{ version }}"

[stacks.rust.binary_release]
manifest_path = "apps/essential-mise-console/Cargo.toml"
version_package = "essential-mise-console"
version_env = "ESSENTIAL_MISE_CONSOLE_VERSION_OVERRIDE"
publication_timeout_minutes = 5
companions = []

[stacks.rust.binary_release.producer]
task = "release:package"
output_directory = "dist/release"
manifest = "dist/release/package-output.json"
tools = ["rust"]
inputs = ["apps/essential-mise-console/Cargo.lock", "apps/essential-mise-console/Cargo.toml", "mise.toml", "scripts/emc-release-package.sh"]
runner = "xcode-27-arm64"
timeout_minutes = 20
build_jobs = 2

[stacks.rust.binary_release.producer.source]
mise_config = "mise.toml"
working_directory = "."

[[stacks.rust.binary_release.products]]
id = "essential-mise-console"
package = "essential-mise-console"
bins = ["essential-mise-console"]
targets = ["aarch64-apple-darwin"]
archive = "tar.gz"

[stacks.rust.binary_release.evidence]
profile = "signed-sbom-v1"

[stacks.rust.binary_release.preview]
enabled = false
versioning = "package-preview-commit-count-sha7"
environment = "preview-publish"

[stacks.rust.binary_release.stable]
enabled = true
environment = "release"

[[stacks.rust.suites]]
id = "functional"
profile = "functional"
run_ignored = "default"
partitions = 1
timeout_minutes = 15
test_threads = 4
triggers = ["pull_request", "push", "workflow_dispatch"]
required = true
manifest_path = "apps/essential-mise-console/Cargo.toml"

[[stacks.rust.suites.artifacts]]
name = "functional-terminal-evidence"
paths = ["target/functional", "target/nextest/functional"]
retention_days = 14

[discovery]
exclude = ["docs/**"]

[actions.overrides]

[agents]
claude_md = "symlink"

[execution]
default_profile = "hosted"
mode = "hosted"
hosted_profile = "hosted"
scale_set_profile = "local"

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "ubuntu-26.04-scale-set"
labels = ["velnor", "ubuntu-26.04-scale-set"]
platform = "linux/amd64"

[[qualified_tools]]
id = "rust"
version = "1.99.1"
depends_on = []

[qualified_tools.backend]
kind = "core"
tool = "rust"

[qualified_tools.options]
kind = "rust"
components = []
targets = []

[[qualified_tools.platforms]]
platform = "macos_arm64"
dependency_artifacts = []
