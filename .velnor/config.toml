schema = 1

[workflow]
policy = "consumer-v1"

default_branch = "main"

runner_label = "ubuntu-26.04"
crate_timeout_minutes = 15

plan_timeout_minutes = 15

[stacks.rust]

compile_driver = "mbx"

test_runner = "cargo_nextest"

run_ignored = "default"

[discovery]

exclude = ["docs/**"]

[agents]

claude_md = "symlink"

[[stacks.rust.suites]]
id = "functional"
profile = "functional"
run_ignored = "default"
partitions = 1
manifest_path = "apps/essential-mise-console/Cargo.toml"
build = "inline"
timeout_minutes = 15
test_threads = 4
required = true
triggers = ["pull_request", "push", "workflow_dispatch"]
artifacts = [{ name = "functional-terminal-evidence", paths = ["target/functional", "target/nextest/functional"], when = "failure", retention_days = 14 }]

[[stacks.rust.configurations]]
name = "default"
features = ["default"]
all_features = true
target = "host"

[stacks.rust.binary_release]
manifest_path = "apps/essential-mise-console/Cargo.toml"
version_package = "essential-mise-console"
version_env = "ESSENTIAL_MISE_CONSOLE_VERSION_OVERRIDE"

[stacks.rust.release]
enabled = true
registry = "git-tag"
packages = ["essential-mise-console"]
manifest_path = "apps/essential-mise-console/Cargo.toml"
environment = "release"
tag_name = "v{{ version }}"

[stacks.rust.binary_release.producer]
task = "release:package"
source = { mise_config = "mise.toml", working_directory = "." }
inputs = ["apps/essential-mise-console/Cargo.lock", "apps/essential-mise-console/Cargo.toml", "mise.toml", "scripts/emc-release-package.sh"]
tools = ["rust"]
runner = "xcode-27-arm64"
timeout_minutes = 20
build_jobs = 2
output_directory = "dist/release"
manifest = "dist/release/package-output.json"

[stacks.rust.binary_release.evidence]
profile = "signed-sbom-v1"

[[stacks.rust.binary_release.products]]
id = "essential-mise-console"
package = "essential-mise-console"
bins = ["essential-mise-console"]
targets = ["aarch64-apple-darwin"]
archive = "tar.gz"

[stacks.rust.binary_release.preview]
enabled = false

[stacks.rust.binary_release.stable]
enabled = true

[[qualified_tools]]
id = "rust"
backend = { kind = "core", tool = "rust" }
version = "1.99.1"
options = { kind = "rust", components = [], targets = [] }
depends_on = []
[[qualified_tools.platforms]]
platform = "macos_arm64"
artifacts = [
  { url = "https://static.rust-lang.org/dist/2026-10-15/cargo-1.99.1-aarch64-apple-darwin.tar.gz", sha256 = "b5cc7634f919949c3e5e131123f813416dc47f6b809a5371d12f1f593595ae13" },
  { url = "https://static.rust-lang.org/dist/2026-10-15/rust-std-1.99.1-aarch64-apple-darwin.tar.gz", sha256 = "c124006d63885ba1029aca49efd59e93be6b2b171c379318ff94a00ef5eba664" },
  { url = "https://static.rust-lang.org/dist/2026-10-15/rustc-1.99.1-aarch64-apple-darwin.tar.gz", sha256 = "cc998c1dc8df006106472357aa87838b2da3f7b25446b98a94cfd58796cb0610" },
]
dependency_artifacts = []
install_tree_sha256 = "8b6dc7388b6c27a3a85430a27a0abd553bcab11ba4c5ca8d563597005d09e451"
[[qualified_tools.platforms.executables]]
name = "cargo"
