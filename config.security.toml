[bootstrap.packages]
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew:mas" = "latest"
"mas:1569813296" = "latest"

[bootstrap.hooks.post-dotfiles]
description = "Materialize 1Password-backed SSH host configuration"
run = '''
if ! /opt/homebrew/bin/op account list >/dev/null 2>&1 || [ -z "$(/opt/homebrew/bin/op account list 2>/dev/null)" ]; then
  printf 'PENDING security/ssh: sign in to 1Password CLI to materialize ~/.ssh/config\n' >&2
  exit 0
fi
tpl="${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}/dotfiles/security/ssh-chainargos.conf.tpl"
rendered="$(/opt/homebrew/bin/op inject -i "$tpl")" || exit 1
/usr/bin/install -d -m 700 "$HOME/.ssh"
BLOCK="$rendered" /usr/bin/python3 -c '
import os, pathlib, re, tempfile
p = pathlib.Path.home() / ".ssh" / "config"
text = p.read_text() if p.exists() else ""
block = "# >>> mise:chainargos >>>\n" + os.environ["BLOCK"].strip() + "\n# <<< mise:chainargos <<<\n"
pat = re.compile(r"(?ms)^# >>> mise:chainargos >>>\n.*?^# <<< mise:chainargos <<<\n?")
if pat.search(text):
    text = pat.sub(block, text)
else:
    if text and not text.endswith("\n"):
        text += "\n"
    if text and not text.endswith("\n\n"):
        text += "\n"
    text += block
with tempfile.NamedTemporaryFile("w", encoding="utf-8", dir=p.parent, prefix=".config.", delete=False) as f:
    tmp = pathlib.Path(f.name)
    f.write(text)
os.chmod(tmp, 0o600)
os.replace(tmp, p)
'
'''
