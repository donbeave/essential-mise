[package]
name = "essential-mise-console"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "essential_mise_console"
path = "src/lib.rs"
doctest = false

[dependencies]
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
termrock = { git = "https://github.com/tailrocks/termrock", rev = "bdd88cf1aa2075c9ac0e0dcfe3a1126217eecf89", default-features = false }

[dev-dependencies]
tui-test = { package = "tuiscotti-tui-test", version = "=0.2.1" }
tuiscotti-latest = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "d8d54155947f6303a41dfd6079b53c0abc16f29a" }
