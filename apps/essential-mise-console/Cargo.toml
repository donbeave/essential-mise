[package]
name = "essential-mise-console"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "essential_mise_console"
path = "src/lib.rs"
doctest = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
junie-tui = { git = "https://github.com/tailrocks/terminal-components-baseline", rev = "2e9e60f53988837c6e1728c71565543edc797d3a", default-features = false }

[dev-dependencies]
tui-test = { package = "tuiscotti-tui-test", version = "=0.2.1" }
tuiscotti-latest = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "d8d54155947f6303a41dfd6079b53c0abc16f29a" }
