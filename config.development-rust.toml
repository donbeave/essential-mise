[settings.github]
credential_command = 'if command -v gh >/dev/null 2>&1; then gh auth token --hostname "$MISE_CREDENTIAL_HOST"; elif [ -x /opt/homebrew/bin/gh ]; then /opt/homebrew/bin/gh auth token --hostname "$MISE_CREDENTIAL_HOST"; elif [ -x /usr/local/bin/gh ]; then /usr/local/bin/gh auth token --hostname "$MISE_CREDENTIAL_HOST"; else exit 1; fi'

[tools]
rust = { version = "latest", mr_boxington = true, components = ["clippy", "rustfmt", "rust-analyzer", "rust-src", "llvm-tools"] }
mr-boxington = { version = "latest" }
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
"github:Canop/bacon" = { version = "latest", bin_path = "aarch64-apple-darwin" }
