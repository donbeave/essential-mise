[bootstrap.packages]
"brew-cask:claude" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:antigravity" = "latest"
"brew-cask:kimi" = "latest"
"brew-cask:opencode-desktop" = "latest"
"brew-cask:zcode" = "latest"
"brew-cask:codexbar" = "latest"

[bootstrap.packages."macos-app:grok-bot"]
version = "0.78.1"
url = "https://downloads.cursor.com/grokbot/stable/darwin-arm64/0.78.1/Grok_Bot_0.78.1.dmg"
sha256 = "0e575dfd2f638808f0487f88dec6bf53a871cac2939de7fe454981f927f9f0d9"
artifact = "Grok Bot.app"
os = "macos/arm64"

[bootstrap.hooks.post-packages]
description = "Real Homebrew: install or upgrade Amp Desktop"
run = '''
if ! /opt/homebrew/bin/brew list --cask amp@beta >/dev/null 2>&1; then
  if [ -d /Applications/Amp.app ]; then
    printf 'Existing /Applications/Amp.app requires manual ownership migration before using Homebrew.\n' >&2
    exit 1
  fi
  /opt/homebrew/bin/brew install --cask ampcode/tap/amp@beta
else
  /opt/homebrew/bin/brew upgrade --cask --greedy ampcode/tap/amp@beta
fi
test -x /Applications/Amp.app/Contents/MacOS/Amp
/usr/bin/codesign --verify --deep --strict /Applications/Amp.app
'''
