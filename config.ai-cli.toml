alias omp-kimi='omp --profile kimi'
alias omp-kimi-yolo='omp --profile kimi --approval-mode=yolo'
alias omp-zai='omp --profile zai'
alias omp-zai-yolo='omp --profile zai --approval-mode=yolo'
alias omp-minimax='omp --profile minimax'
alias omp-minimax-yolo='omp --profile minimax --approval-mode=yolo'
alias omp-mimo='omp --profile mimo'
alias omp-mimo-yolo='omp --profile mimo --approval-mode=yolo'
function _omp-anthropic-api {
  local profile="$1" ref_var="$2"
  shift 2
  local ref="${(P)ref_var:-}" key="${ANTHROPIC_API_KEY:-}"
  if [[ -z "$key" ]]; then
    if [[ -z "$ref" ]]; then
      printf '%s: set %s to a 1Password reference or export ANTHROPIC_API_KEY\n' "$profile" "$ref_var" >&2
      return 1
    fi
    key="$(op read "$ref")" || return 1
  fi
  ANTHROPIC_API_KEY="$key" omp --profile "$profile" "$@"
}
function omp-anthropic-api-patrick {
