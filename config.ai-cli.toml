[bootstrap.packages]
"brew:jq" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:cursor-cli" = "latest"
"brew-cask:antigravity-cli" = "latest"
"brew:kimi-code" = "latest"
"brew:opencode" = "latest"
"brew-cask:grok-build" = "latest"

[bootstrap.hooks.post-packages]
description = "Real Homebrew: install or upgrade Claude Code, Amp CLI, OMP, and Muse Code"
run = [
  "if ! /opt/homebrew/bin/brew list --cask claude-code@latest >/dev/null 2>&1; then /opt/homebrew/bin/brew install --cask claude-code@latest; else /opt/homebrew/bin/brew upgrade --cask --greedy claude-code@latest; fi",
  "if ! /opt/homebrew/bin/brew list --formula ampcode >/dev/null 2>&1; then /opt/homebrew/bin/brew install ampcode/tap/ampcode; else /opt/homebrew/bin/brew upgrade --formula ampcode/tap/ampcode; fi",
  "if ! /opt/homebrew/bin/brew list --formula omp >/dev/null 2>&1; then /opt/homebrew/bin/brew install can1357/tap/omp; else /opt/homebrew/bin/brew upgrade --formula can1357/tap/omp; fi",
  "if ! /opt/homebrew/bin/brew list --cask muse-code >/dev/null 2>&1; then /opt/homebrew/bin/brew install --cask muse-code; else /opt/homebrew/bin/brew upgrade --cask --greedy muse-code; fi",
  "/opt/homebrew/bin/claude --version",
  "/opt/homebrew/bin/amp --version",
  "/opt/homebrew/bin/omp --version",
  "/opt/homebrew/bin/muse --version",
]

[bootstrap.repos]
"~/.local/share/pstack-claude" = { url = "https://github.com/michael-denyer/pstack-claude.git", ref = "main", depth = 1 }

[bootstrap.hooks.post-repos]
description = "Install or update pstack through the Claude Code, Codex, OMP, OpenCode, and Muse Code plugin mechanisms"
run = [
  "/bin/bash \"${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}/bin/pstack-plugins.sh\"",
]

[bootstrap.hooks.post-dotfiles]
description = "XDG-aware Amp Fish completion block; preserves unrelated startup content"
run = [
  "/usr/bin/python3 \"${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}/bin/fish-config.py\" apply amp",
  "/usr/bin/python3 \"${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}/bin/fish-config.py\" status amp",
]

[dotfiles]
"~/.claude/CLAUDE.md" = { source = "dotfiles/ai-cli/claude/CLAUDE.md", mode = "copy" }
"~/.claude/agents" = { source = "dotfiles/ai-cli/claude/agents", mode = "copy" }
"~/.claude/skills/repo-context" = { source = "dotfiles/ai-cli/claude/skills/repo-context", mode = "copy" }
"~/.claude/skills/rust-practices" = { source = "dotfiles/ai-cli/claude/skills/rust-practices", mode = "copy" }
"~/.claude/skills/typescript-react-practices" = { source = "dotfiles/ai-cli/claude/skills/typescript-react-practices", mode = "copy" }
"~/.claude/skills/tanstack-start" = { source = "dotfiles/ai-cli/claude/skills/tanstack-start", mode = "copy" }
"~/.claude/skills/openshell" = { source = "dotfiles/ai-cli/claude/skills/openshell", mode = "copy" }
"~/.claude/skills/github-actions" = { source = "dotfiles/ai-cli/claude/skills/github-actions", mode = "copy" }
"~/.claude/pstack-models.md" = { source = "dotfiles/ai-cli/claude/pstack-models.md", mode = "copy" }
"~/.claude/project-notes" = { source = "dotfiles/ai-cli/claude/project-notes", mode = "copy" }
"~/.claude/settings.json/agents" = { source = "dotfiles/ai-cli/claude/settings.json", merge = true }
"~/.config/opencode/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy", variants = [{ default = true, target = "{{ xdg_config_home }}/opencode/AGENTS.md" }] }
"~/.grok/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.grok/config.toml" = { source = "dotfiles/ai-cli/grok/config.toml", mode = "copy" }
"~/.grok/agents" = { source = "dotfiles/ai-cli/grok/agents", mode = "copy" }
"~/.grok/sync-subagents.py" = { source = "dotfiles/ai-cli/grok/sync-subagents.py", mode = "copy" }
"~/.kimi-code/AGENTS.md" = { source = "dotfiles/ai-cli/KIMI.md", mode = "template" }
"~/.config/amp/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.omp/agent/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.codex/AGENTS.md" = { source = "dotfiles/ai-cli/CODEX.md", mode = "template" }
"~/.omp/agent/config.yml/shared" = { source = "dotfiles/ai-cli/omp/config.yml", merge = true }
"~/.omp/agent/models.yml/shared" = { source = "dotfiles/ai-cli/omp/models.yml", merge = true }
"~/.zshrc/amp" = { block = '''
autoload -Uz compinit
(( $+functions[compdef] )) || compinit
command -v amp >/dev/null 2>&1 && source <(amp completions zsh)
''' }
"~/.zshrc/claude-statusline" = { block = '''
function claude {
  local statusline="${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}/bin/claude-statusline.sh"
  local statusline_command settings
  printf -v statusline_command '%q' "$statusline"
  settings="$(/opt/homebrew/bin/jq -cn --arg command "$statusline_command" '{statusLine:{type:"command",command:$command,padding:0,refreshInterval:5}}')" || return
  BASH_COMPAT=3.2 command claude --settings "$settings" "$@"
}
''' }
"~/.zshrc/yolo" = { block = '''
function _claude-yolo {
  local config_dir="$1" settings
  shift
  if [[ -f "$config_dir/settings.json" ]]; then
    settings="$(/opt/homebrew/bin/jq -c 'del(.permissions.deny, .permissions.ask)' "$config_dir/settings.json")" || return
  else
    settings='{}'
  fi
  CLAUDE_CODE_EVEN_MORE_DANGEROUSLY_SKIP_PERMISSIONS=1 claude --dangerously-skip-permissions --setting-sources '' --settings "$settings" "$@"
}
function claude-yolo {
  _claude-yolo "${CLAUDE_CONFIG_DIR:-$HOME/.claude}" "$@"
}
function claude-scentbird {
  CLAUDE_CONFIG_DIR="$HOME/.claude-scentbird" claude "$@"
}
function claude-scentbird-yolo {
  CLAUDE_CONFIG_DIR="$HOME/.claude-scentbird" _claude-yolo "$HOME/.claude-scentbird" "$@"
}
function claude-scentbird-ai {
  CLAUDE_CONFIG_DIR="$HOME/.claude-scentbird-ai" claude "$@"
}
function claude-scentbird-ai-yolo {
  CLAUDE_CONFIG_DIR="$HOME/.claude-scentbird-ai" _claude-yolo "$HOME/.claude-scentbird-ai" "$@"
}
function claude-chainargos {
  CLAUDE_CONFIG_DIR="$HOME/.claude-chainargos" claude "$@"
}
function claude-chainargos-yolo {
  CLAUDE_CONFIG_DIR="$HOME/.claude-chainargos" _claude-yolo "$HOME/.claude-chainargos" "$@"
}
function claude-chainargos2 {
  CLAUDE_CONFIG_DIR="$HOME/.claude-chainargos2" claude "$@"
}
function claude-chainargos2-yolo {
  CLAUDE_CONFIG_DIR="$HOME/.claude-chainargos2" _claude-yolo "$HOME/.claude-chainargos2" "$@"
}
alias codex-yolo='codex --yolo'
alias cursor-yolo='cursor-agent --yolo'
alias agy-yolo='agy --dangerously-skip-permissions'
alias kimi-yolo='kimi --auto'
alias opencode-yolo='opencode --auto'
alias grok-yolo='grok --yolo'
alias amp-yolo='amp --dangerously-allow-all'
alias omp-yolo='omp --approval-mode=yolo'
''' }
