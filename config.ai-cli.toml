[bootstrap.packages]
"brew:jq" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:cursor-cli" = "latest"
"brew-cask:antigravity-cli" = "latest"
"brew:kimi-code" = "latest"
"brew:opencode" = "latest"
"brew-cask:grok-build" = "latest"

[bootstrap.hooks.post-packages]
description = "Presence-only real Homebrew: Claude Code, Amp CLI, and OMP; upgrades are separate"
run = [
  "if ! /opt/homebrew/bin/brew list --cask claude-code@latest >/dev/null 2>&1; then /opt/homebrew/bin/brew install --cask claude-code@latest; fi",
  "if ! /opt/homebrew/bin/brew list --formula ampcode >/dev/null 2>&1; then /opt/homebrew/bin/brew install ampcode/tap/ampcode; fi",
  "if ! /opt/homebrew/bin/brew list --formula omp >/dev/null 2>&1; then /opt/homebrew/bin/brew install can1357/tap/omp; fi",
  "/opt/homebrew/bin/claude --version",
  "/opt/homebrew/bin/amp --version",
  "/opt/homebrew/bin/omp --version",
]

[bootstrap.hooks.post-dotfiles]
description = "XDG-aware Amp Fish completion block; preserves unrelated startup content"
run = [
  "/usr/bin/python3 \"{{ config_source | dirname }}/bin/fish-config.py\" apply amp",
  "/usr/bin/python3 \"{{ config_source | dirname }}/bin/fish-config.py\" status amp",
]

[dotfiles]
"~/.claude/CLAUDE.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.config/opencode/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.grok/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.kimi-code/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.config/amp/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.omp/agent/AGENTS.md" = { source = "dotfiles/ai-cli/GLOBAL_AGENTS.md", mode = "copy" }
"~/.codex/AGENTS.md" = { source = "dotfiles/ai-cli/CODEX.md", mode = "copy" }
"~/.omp/agent/config.yml/shared" = { source = "dotfiles/ai-cli/omp/config.yml", merge = true }
"~/.omp/agent/models.yml/shared" = { source = "dotfiles/ai-cli/omp/models.yml", merge = true }
"~/.zshrc/amp" = { block = '''
autoload -Uz compinit
(( $+functions[compdef] )) || compinit
command -v amp >/dev/null 2>&1 && source <(amp completions zsh)
''' }
"~/.zshrc/claude-statusline" = { block = '''
function claude {
  local statusline="${MISE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/mise}/bin/claude-statusline.sh"
  local statusline_command settings
  printf -v statusline_command '%q' "$statusline"
  settings="$(/opt/homebrew/bin/jq -cn --arg command "$statusline_command" '{statusLine:{type:"command",command:$command,padding:0,refreshInterval:5}}')" || return
  BASH_COMPAT=3.2 command claude --settings "$settings" "$@"
}
''' }
