}
alias codex-yolo='codex --yolo'
alias cursor-yolo='cursor-agent --yolo'
alias agy-yolo='agy --dangerously-skip-permissions'
alias kimi-yolo='kimi --auto'
alias opencode-yolo='opencode --auto'
alias grok-yolo='grok --yolo'
alias amp-yolo='amp --dangerously-allow-all'
alias omp-yolo='omp --approval-mode=yolo'
