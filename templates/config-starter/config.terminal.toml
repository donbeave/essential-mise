#: description = "Shell prompt and terminal utilities"
#: order = 10

[bootstrap.packages]
"brew:starship" = "latest"   # pin-exception: Homebrew formulae have no version pins
"brew:bat" = "latest"   # pin-exception: Homebrew formulae have no version pins

[dotfiles]
"~/.config/starship.toml" = { source = "dotfiles/terminal/starship.toml", mode = "copy" }
"~/.zshrc/terminal" = { block = '''
command -v starship >/dev/null 2>&1 && eval "$(starship init zsh)"
''' }
